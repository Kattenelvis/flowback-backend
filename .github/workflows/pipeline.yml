name: Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  LINK: http://localhost:8085
  TEST_PASS: TestPassword
  PUBLIC_POLL_VERSION: 2
  # PR images get their own tag so unmerged code never becomes :latest (which prod pulls)
  BACKEND_TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'latest' }}

jobs:
  backend-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flowback_test
          POSTGRES_USER: flowback
          POSTGRES_PASSWORD: flowback
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      FLOWBACK_PSQL_NAME: flowback_test
      FLOWBACK_PSQL_USER: flowback
      FLOWBACK_PSQL_PASSWORD: flowback
      FLOWBACK_PSQL_HOST: localhost
      FLOWBACK_PSQL_PORT: "5432"
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Start Celery worker and beat
        run: |
          celery -A backend worker --loglevel=info &
          celery -A backend beat --loglevel=info &

      - name: Run tests
        run: pytest --disable-warnings

  build:
    needs: backend-tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          outputs: type=docker,dest=/tmp/flowback-backend.tar
          tags: flowback-backend:ci

      - uses: actions/upload-artifact@v4
        with:
          name: flowback-backend-image
          path: /tmp/flowback-backend.tar
          retention-days: 1

  frontend-tests:
    needs: build
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      LINK: http://localhost:8085
      TEST_PASS: TestPassword
    steps:
      - name: Checkout flowback-docker
        uses: actions/checkout@v4
        with:
          repository: Kattenelvis/flowback-docker
          path: flowback-docker

      - uses: actions/download-artifact@v4
        with:
          name: flowback-backend-image

      - name: Load backend image
        run: docker load --input flowback-backend.tar

      # Tag the CI image with the names flowback-docker's compose file expects for
      # the backend and Celery services, so they run this commit's code
      - name: Tag backend image for Compose services
        working-directory: flowback-docker
        run: |
          for image in $(docker compose config --images | grep -E 'flowback-(backend|celery)'); do
            docker tag flowback-backend:ci "$image"
          done

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: Kattenelvis/flowback-frontend
          path: flowback-frontend
          ref: master

      - name: Build images
        working-directory: flowback-docker
        run: docker compose build flowback-frontend caddy

      - name: Pull published images
        working-directory: flowback-docker
        run: docker compose pull flowback-postgresql flowback-redis

      # --pull never: fail instead of silently falling back to a published image
      - name: Start Flowback stack
        working-directory: flowback-docker
        run: docker compose up -d --no-build --pull never

      - uses: actions/checkout@v4
        with:
          repository: Kattenelvis/flowback-interface-testing
          path: flowback-interface-testing

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: flowback-interface-testing
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: flowback-interface-testing
        run: npx playwright install --with-deps chromium

      - name: Verify interface test configuration
        working-directory: flowback-interface-testing
        run: test -n "$TEST_PASS"

      - name: Run Smoke tests (basic login functionality)
        working-directory: flowback-interface-testing
        run: npx playwright test -g "Smoke-Test" --project chromium --retries 1
          --workers 1

      - name: Run the rest of the tests
        working-directory: flowback-interface-testing
        run:
          npx playwright test . --project chromium --retries 2 --workers 1 --reporter list
          --grep-invert "Smoke-Test"

      - name: Dump docker logs on failure
        if: ${{ failure() }}
        working-directory: flowback-docker
        run: docker compose logs

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: flowback-interface-testing/playwright-report/
          retention-days: 30

  docker-publish:
    needs: frontend-tests
    permissions: {}
    # Fork PRs get no secrets, so skip publishing instead of failing
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flowback-backend-image

      - name: Load backend image
        run: docker load --input flowback-backend.tar

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish backend image
        run: |
          docker tag flowback-backend:ci ${{ secrets.DOCKERHUB_USERNAME }}/flowback-backend:$BACKEND_TAG
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/flowback-backend:$BACKEND_TAG

  publish-dev:
    needs: docker-publish
    permissions: {}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          # The SSH user can't read the checkout; run the deploy as flowback
          script: |
            sudo -n -iu flowback bash -se <<'EOF'
            cd /home/flowback/dev-flowback
            export BACKEND_TAG=${{ env.BACKEND_TAG }}
            docker compose pull flowback-frontend flowback-backend flowback-postgresql flowback-redis
            docker compose up -d --no-build flowback-frontend flowback-backend flowback-postgresql flowback-redis
            docker compose build caddy
            docker compose up -d --no-build caddy
            EOF

  # Production publishes only from master pushes.
  publish-prod:
    needs: publish-dev
    permissions: {}
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          # The SSH user can't read the checkout; run the deploy as flowback
          script: |
            sudo -n -iu flowback bash -se <<'EOF'
            cd /home/flowback/prod-flowback
            docker compose pull flowback-frontend flowback-backend flowback-postgresql flowback-redis
            docker compose up -d --no-build flowback-frontend flowback-backend flowback-postgresql flowback-redis
            docker compose build caddy
            docker compose up -d --no-build caddy
            EOF
